<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product C 原始静态与增强静态标签对照</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: #e9ece9;
      color: #191714;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .board {
      width: 1600px;
      min-height: 1320px;
      margin: 0 auto;
      padding: 44px 56px 38px;
      background: linear-gradient(180deg, #f7f6f2 0%, #e7e9e5 100%);
    }
    header { text-align: center; }
    h1 { margin: 0; font-size: 34px; letter-spacing: .02em; }
    .subtitle { margin: 10px 0 24px; color: #615d56; font-size: 16px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; }
    .panel {
      padding: 18px;
      border: 1px solid #c7c9c3;
      border-radius: 16px;
      background: rgba(255,255,255,.86);
      box-shadow: 0 16px 36px rgba(28, 34, 29, .10);
    }
    .panel-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
      padding: 0 3px;
    }
    h2 { margin: 0; font-size: 23px; }
    .tag { padding: 5px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; }
    .original .tag { color: #49311b; background: #eee5da; }
    .enhanced .tag { color: #fff; background: #6b3e1b; }
    .label-image {
      display: block;
      width: 100%;
      height: 900px;
      object-fit: contain;
      object-position: center top;
      border: 1px solid #dbddd8;
      background: #d8dcda;
    }
    .takeaway {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      margin-top: 20px;
      padding: 18px 24px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 22px rgba(28, 34, 29, .07);
      font-size: 16px;
      line-height: 1.5;
    }
    .arrow { color: #8b5a2b; font-size: 30px; font-weight: 800; }
    .takeaway strong { display: block; margin-bottom: 3px; color: #6b3e1b; }
    footer { margin-top: 14px; color: #69645d; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <main class="board">
    <header>
      <h1>Product C · 原始静态 vs 增强静态</h1>
      <p class="subtitle">同一款虚构玉米杀虫剂、同一套内容与限制，仅改变信息组织和操作支持</p>
    </header>

    <section class="pair">
      <article class="panel original">
        <div class="panel-heading"><h2>原始静态标签</h2><span class="tag">Baseline</span></div>
        <img class="label-image" src="static_label_product_c_render.png" alt="Product C 原始静态标签">
      </article>
      <article class="panel enhanced">
        <div class="panel-heading"><h2>增强静态标签</h2><span class="tag">Information Enhancement</span></div>
        <img class="label-image" src="enhanced_static_label_product_c_render.png" alt="Product C 增强静态标签">
      </article>
    </section>

    <section class="takeaway">
      <div><strong>原始结构</strong>剂量、次数、混配禁忌和安全间隔分散在表格与长段文字中。</div>
      <div class="arrow">→</div>
      <div><strong>增强结构</strong>Quick Guidance → Critical Limits → Problem Response → Full Label。</div>
    </section>

    <footer>实验用虚构农药标签 · 禁止用于真实农业生产</footer>
  </main>
</body>
</html>
